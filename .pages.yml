media:
  input: public/images
  output: /images
  rename: safe

content:
  - name: notes
    label: Notes
    type: collection
    path: src/content/notes
    filename: "{primary}.mdx"
    view:
      fields: [title, description, publishDate, draft]
      primary: title
      sort: [publishDate, title, draft]
      default:
        sort: publishDate
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: description
        label: Description
        type: text
        required: true

      - name: publishDate
        label: Publish date
        type: date
        required: true

      - name: author
        label: Author
        type: string
        default: ohwire

      - name: authorImage
        label: Author image
        type: string
        default: /images/avatar.jpeg

      - name: category
        label: Category
        type: select
        options:
          values:
            - Setup
            - Notes
            - Tools
            - SaaS

      - name: image
        label: Cover image
        type: image

      - name: imageAlt
        label: Image alt text
        type: string

      - name: featured
        label: Featured
        type: boolean
        default: false

      - name: draft
        label: Draft
        type: boolean
        default: true

      - name: body
        label: Content
        type: rich-text

  - name: tools
    label: Tools
    type: collection
    path: src/content/tools
    filename: "{primary}.md"
    view:
      fields: [title, category, order]
      primary: title
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: description
        label: Description
        type: text
        required: true

      - name: category
        label: Category
        type: string
        required: true

      - name: githubUrl
        label: GitHub URL
        type: string
        required: true

      - name: liveUrl
        label: Live URL
        type: string

      - name: image
        label: Screenshot
        type: image

      - name: imageAlt
        label: Screenshot alt text
        type: string

      - name: stack
        label: Stack
        type: string
        list: true

      - name: note
        label: Related note slug
        type: string

      - name: order
        label: Order
        type: number
        default: 0

      - name: body
        label: Highlights
        type: text
